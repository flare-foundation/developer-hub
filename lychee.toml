base_url = "https://dev.flare.network/"
verbose = "info"
no_progress = true
cache = true
max_cache_age = "2d"
cache_exclude_status = ["403", "429", "500.."]
timeout = 30
retry_wait_time = 3
max_retries = 5
max_concurrency = 8
# Pace each host so a cold crawl does not burst GitHub into HTML 503s.
# lychee 0.24 retries 429 only, so those 503s are retried in CI instead of accepted here.
host_concurrency = 4
host_request_interval = "100ms"
accept = ["200..=399", "429"]
exclude_all_private = true
exclude = [
    '^https://dev\.flare\.network/',
    '^https://fdc-verifiers-testnet\.flare\.network/',
    '^https://github\.com/flare-foundation/flare-hardhat-starter/',
    '^https://github\.com/flare-foundation/flare-foundry-starter/',
    '^https://github\.com/.*/pkgs/',
    '^https://(www\.)?etherscan\.io/',
    '^https://sepolia\.etherscan\.io/',
    '^https://(www\.)?bscscan\.com/',
    '^https://(www\.)?monadscan\.com/',
    '^https://(www\.)?4byte\.directory/',
    # Bitcoin Wiki answers non-browser clients with 418. The pages are valid in a browser.
    '^https://en\.bitcoin\.it/',
    # Streamable HTTP rejects GET with 405. Clients call this server with POST.
    '^https://mcp\.flare\.network/',
    '^https://t\.me/',
    '^https://metamask\.io/',
    '^https://openweathermap\.org/',
    '^https://www\.gnu\.org/',
    '^https://gcc\.gnu\.org/',
    '^https://swapi\.dev/',
    '^https://www\.npmjs\.com/',
    '^https://discord\.com/',
    '^https://docs\.eigencloud\.xyz/',
    '^https://console\.cloud\.google\.com/',
]

[hosts."github.com"]
concurrency = 2
request_interval = "200ms"
